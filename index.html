<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
:root{--gold:#f4d58a;--panel:#14283ddd;--line:#ffffff35}*{box-sizing:border-box}
body{margin:0;background:#101d2b;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;overflow-x:hidden}
header{height:54px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;background:#0c1826eF;border-bottom:1px solid var(--line);position:relative;z-index:2}
.brand{font-weight:900;letter-spacing:2px;color:var(--gold)}.stats{font-size:13px;display:flex;gap:12px}
main{max-width:1000px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px}
#world{height:min(70vh,650px);min-height:410px;position:relative;overflow:hidden;border:1px solid #ffffff45;border-radius:17px;background:linear-gradient(#91c8e7,#d7e5d7);isolation:isolate}#world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#07152208 45%,#07152266 100%);pointer-events:none;z-index:1}.mountain,.tree{display:none}#world3d{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}#hero{display:none}.poi{display:none!important}.fallback2d .poi{display:block!important}.fallback2d #hero{display:block!important}.fallback2d #world3d{display:none!important}.fallback2d .mountain,.fallback2d .tree{display:block!important}.location{z-index:4;pointer-events:none}.hint{z-index:4;pointer-events:none}#interactBtn{z-index:5}#worldHint{z-index:4}.world-help{position:absolute;right:10px;top:10px;z-index:4;background:#102238b9;padding:7px 10px;border-radius:9px;font-size:11px;color:#fff;pointer-events:none}
.compass{position:absolute;left:12px;top:12px;width:76px;height:76px;border:1px solid #ffffff99;border-radius:50%;background:#102238b9;z-index:4;color:#fff;pointer-events:none;box-shadow:0 3px 12px #0005}.compass #compassRose{position:absolute;inset:0;transition:transform .08s linear}.compass span{position:absolute;font-size:11px;font-weight:900;text-shadow:0 1px 3px #000}.compass .north{top:5px;left:33px;color:#ff7777}.compass .south{bottom:5px;left:33px}.compass .east{right:7px;top:31px}.compass .west{left:7px;top:31px}.compass i{position:absolute;left:34px;top:19px;width:7px;height:29px;background:linear-gradient(#ff6464 0 50%,#fff 50%);clip-path:polygon(50% 0,100% 100%,50% 78%,0 100%)}
#world:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff12,transparent 45%,#07152233);pointer-events:none;z-index:0}
.mountain{position:absolute;bottom:40%;width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-bottom:190px solid #627e86;filter:drop-shadow(0 7px 0 #506d67)}
.m1{left:-35px}.m2{right:-55px;transform:scale(1.3);border-bottom-color:#718b91}
.tree{position:absolute;font-size:42px;filter:drop-shadow(2px 4px 2px #183b2c99)}
#hero{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font-size:58px;filter:drop-shadow(0 5px 3px #1225);z-index:1;transition:left .12s,top .12s;animation:catIdle 1.8s ease-in-out infinite;user-select:none} @keyframes catIdle{0%,100%{translate:0 0}50%{translate:0 -7px}}
#hero:after{content:"";position:absolute;width:34px;height:8px;background:#10251c66;border-radius:50%;bottom:-1px;left:5px;z-index:-1}
.location{position:absolute;top:12px;left:12px;background:#102238b9;padding:7px 11px;border-radius:9px;font-size:13px}
.hint{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;background:#102238a9;padding:7px;border-radius:9px;font-size:12px}
.poi{position:absolute;z-index:2;border:0;background:#f5d78c;color:#263448;border-radius:20px;padding:7px 11px;font-weight:800;box-shadow:0 3px 10px #1425;opacity:.88}.poi.nearby{opacity:1;outline:3px solid #fff;box-shadow:0 0 0 6px #f5d78c66,0 3px 15px #1425;transform:scale(1.08)}#interactBtn{display:none;position:absolute;z-index:3;left:50%;bottom:48px;transform:translateX(-50%);border:1px solid #fff;background:#f5d78c;color:#263448;border-radius:24px;padding:9px 18px;font-weight:900;box-shadow:0 4px 18px #0008}#interactBtn.show{display:block}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;min-height:370px}
h2{font-size:17px;margin:0 0 10px;color:var(--gold)}.muted{color:#b9c8d4;font-size:12px}
button{font:inherit;cursor:pointer}.tabrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.tab,.action{border:1px solid var(--line);background:#ffffff12;color:white;border-radius:9px;padding:9px 5px;font-size:13px}
.tab.active,.action.primary{background:linear-gradient(120deg,#b98b4d,#e4c47e);color:#263448;border:0;font-weight:800}
.content{font-size:13px;line-height:1.6}.action{width:100%;margin-top:7px}
.card{background:#ffffff10;border:1px solid var(--line);border-radius:10px;padding:9px;margin:7px 0}
#controls{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:5px;justify-content:center;margin:12px auto}
#controls button{border-radius:12px;background:#14283ddd;color:white;border:1px solid #ffffff66;font-size:20px;touch-action:none}
#controls .up{grid-column:2}.down{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}
#battle{display:none;position:fixed;inset:0;background:#081321eF;z-index:5;align-items:center;justify-content:center;padding:18px}
#battlebox{max-width:420px;width:100%;background:linear-gradient(145deg,#253d5b,#17233a);border:1px solid #ffffff55;border-radius:18px;padding:20px;text-align:center}
.enemy{font-size:75px;margin:10px}.bar{height:9px;background:#ffffff25;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#e77e70;width:100%}.catStats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:9px 0}.catStat{background:#ffffff12;border:1px solid var(--line);border-radius:8px;padding:7px}.catStat b{color:#ffe3a0}.catHp{height:8px;background:#ffffff25;border-radius:9px;overflow:hidden;margin:6px 0}.catHp i{display:block;height:100%;background:#79d49b;width:100%}

#wishReveal{display:none;position:fixed;inset:0;z-index:8;background:radial-gradient(ellipse at 50% 35%,#66518f 0%,#17233f 48%,#080f20 100%);align-items:center;justify-content:center;padding:18px;overflow:auto}
#wishReveal.show{display:flex;animation:wishFade .35s ease-out}
#wishBox{width:min(760px,100%);text-align:center}
#wishTitle{font-size:clamp(23px,5vw,38px);font-weight:900;color:#ffe6a5;text-shadow:0 0 22px #ffdb83;margin:4px 0 8px}
#wishSubtitle{color:#e6d9ff;font-size:13px;margin-bottom:18px}
#wishBeam{height:5px;width:0;margin:0 auto 20px;background:linear-gradient(90deg,transparent,#fff,#ffe28b,transparent);box-shadow:0 0 24px 8px #d8c2ff;transition:width .7s ease}
#wishReveal.ready #wishBeam{width:90%}
#wishCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.wishCard{min-height:175px;border:1px solid #ffffff55;border-radius:14px;padding:12px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:translateY(22px) scale(.8);animation:wishPop .5s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--delay);box-shadow:0 8px 25px #0006}
.wishCard.r5{background:linear-gradient(155deg,#9b642e,#553b73 75%);border-color:#ffe3a0;box-shadow:0 0 20px #f7cf7c66}
.wishCard.r4{background:linear-gradient(155deg,#554b91,#263e68)}
.wishCard.r3{background:linear-gradient(155deg,#53677d,#29374c)}
.wishEmoji{font-size:clamp(34px,7vw,56px);margin:8px 0;filter:drop-shadow(0 5px 6px #0008)}
.wishName{font-weight:900;font-size:13px;line-height:1.4}
.wishStars{color:#ffe08a;letter-spacing:1px;font-size:12px;margin-top:7px}
#wishClose{max-width:260px;margin:20px auto 0}
@keyframes wishFade{from{opacity:0}to{opacity:1}}
@keyframes wishPop{to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){#wishCards{grid-template-columns:repeat(2,minmax(0,1fr))}.wishCard{min-height:145px}}
@media(max-width:720px){main{display:flex;flex-direction:column;padding:8px}#world{height:48vh;min-height:310px}#panel{min-height:0}#controls{display:grid}.stats{gap:7px;font-size:12px}}
</style></head>
<body>
<header><div class="brand">✦ 星境旅人</div><div class="stats"><span>💎 <b id="gems">1600</b></span><span>🪙 <b id="coins">300</b></span><span>⭐ <b id="primogems">0</b></span></div></header>
<main><section>
<div id="world">
<canvas id="world3d" aria-label="星境旅人 3D 冒險世界"></canvas>
<div class="world-help">WASD 移動 · 拖曳旋轉視角 · 滾輪縮放 · E 互動</div>
<div class="compass" aria-label="方向羅盤"><div id="compassRose"><span class="north">N</span><span class="east">E</span><span class="south">S</span><span class="west">W</span><i></i></div></div>
<div class="mountain m1"></div><div class="mountain m2"></div>
<div class="tree" style="left:12%;bottom:15%">🌲</div><div class="tree" style="left:29%;bottom:22%">🌳</div><div class="tree" style="right:15%;bottom:13%">🌲</div><div class="tree" style="right:34%;bottom:27%">🌳</div>
<div class="location" id="loc">📍 貓咪風語草原</div><div id="hero" role="img" aria-label="玩家主角：驚嚇貓" title="驚嚇貓">🐈</div>

<script>if(!window.THREE){document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></scr'+'ipt>')}</script>
<script>
const $=id=>document.getElementById(id);
let state;
try{state=JSON.parse(localStorage.getItem('starTraveler')||'null')}catch(err){console.warn('舊存檔讀取失敗，已建立新存檔',err);state=null}
if(!state||typeof state!=='object'||Array.isArray(state))state={gems:1600,coins:300,primogems:0,owned:['咪露'],pity:0,x:50,y:55,chest:false,quest:false};
state.owned=Array.isArray(state.owned)?state.owned:['咪露'];
state.pity=Number(state.pity)||0;
state.x=Number.isFinite(Number(state.x))?Number(state.x):50;
state.y=Number.isFinite(Number(state.y))?Number(state.y):55;
// 舊版存檔相容：確保頂部鑽石（星石）永遠是數字
state.gems=Number.isFinite(Number(state.gems))?Number(state.gems):1600;
state.coins=Number.isFinite(Number(state.coins))?Number(state.coins):300;
state.primogems=Number.isFinite(Number(state.primogems))?Number(state.primogems):0;
state.catLevel=state.catLevel||1;state.catXp=state.catXp||0;
state.region=state.region||'風語草原';state.dailyWins=Number(state.dailyWins)||0;
state.claimedQuests=Array.isArray(state.claimedQuests)?state.claimedQuests:[];
state.gatheredNodes=Array.isArray(state.gatheredNodes)?state.gatheredNodes:[];
state.materials=state.materials&&typeof state.materials==='object'?state.materials:{};
state.visitedRegions=Array.isArray(state.visitedRegions)?state.visitedRegions:['風語草原'];
const chestCatalog=[{id:0,name:'草叢木箱',emoji:'🧰',gems:80,coins:60,primogems:2},{id:1,name:'星光寶箱',emoji:'✨',gems:140,coins:90,primogems:5},{id:2,name:'古老寶箱',emoji:'🎁',gems:180,coins:120,primogems:8},{id:3,name:'森林寶箱',emoji:'🌿',gems:100,coins:160,primogems:3},{id:4,name:'稀有寶箱',emoji:'💎',gems:260,coins:180,primogems:12}];
if(!Array.isArray(state.openedChests)){state.openedChests=state.chest?[0]:[];}

// 所有角色統一使用相同欄位：name、rarity、stars、element、emoji、role、desc、skill、baseHp、baseAtk、baseDef
const characters=[
{name:'咪露',rarity:'★★★★★',stars:5,element:'星',emoji:'🐱',role:'主攻手',desc:'把星光凝聚在貓掌上的勇敢小隊長。',skill:'星月爪擊',baseHp:180,baseAtk:32,baseDef:18},
{name:'燒燒',rarity:'★★★★★',stars:5,element:'火',emoji:'🐈',role:'爆發手',desc:'尾巴燃起火焰，擅長瞬間爆發。',skill:'喵焰流星',baseHp:165,baseAtk:36,baseDef:15},
{name:'沫沫',rarity:'★★★★',stars:4,element:'水',emoji:'😺',role:'治療手',desc:'用泡泡治癒夥伴的溫柔貓咪。',skill:'泡泡療癒',baseHp:175,baseAtk:23,baseDef:19},
{name:'雪糕',rarity:'★★★★',stars:4,element:'冰',emoji:'🐈‍⬛',role:'控場手',desc:'能讓敵人慢下來的冷靜貓咪。',skill:'冰晶喵環',baseHp:160,baseAtk:27,baseDef:17},
{name:'電電',rarity:'★★★★',stars:4,element:'雷',emoji:'😼',role:'速度手',desc:'快如閃電，連鬍鬚都帶著電光。',skill:'雷光衝刺',baseHp:155,baseAtk:29,baseDef:15},
{name:'芽芽',rarity:'★★★',stars:3,element:'草',emoji:'😸',role:'輔助手',desc:'帶著小草球旅行的活潑貓咪。',skill:'嫩葉拍擊',baseHp:145,baseAtk:21,baseDef:14},
{name:'呼呼',rarity:'★★★',stars:3,element:'風',emoji:'🐾',role:'速度手',desc:'跑過時會帶起一陣微風。',skill:'旋風肉球',baseHp:135,baseAtk:23,baseDef:12},
{name:'圓圓',rarity:'★★',stars:2,element:'岩',emoji:'🐱',role:'防守手',desc:'圓滾滾但很可靠的小守衛。',skill:'小石盾',baseHp:150,baseAtk:15,baseDef:18},
{name:'滴滴',rarity:'★★',stars:2,element:'水',emoji:'😺',role:'輔助手',desc:'喜歡玩水，能幫隊伍補充活力。',skill:'水滴彈',baseHp:130,baseAtk:16,baseDef:14},
{name:'豆豆',rarity:'★',stars:1,element:'無',emoji:'🐈',role:'新手',desc:'剛踏上旅程、努力學習的小貓。',skill:'努力喵拳',baseHp:110,baseAtk:12,baseDef:10},
{name:'小灰',rarity:'★',stars:1,element:'無',emoji:'🐾',role:'新手',desc:'膽小但很努力，總是跟著大家。',skill:'勇氣拍擊',baseHp:115,baseAtk:11,baseDef:11},
{name:'露卡',rarity:'★★★★★',stars:5,element:'火',emoji:'🦊',role:'爆發手',desc:'來自熾焰山脈的旅者，能引爆敵人的弱點。',skill:'熾焰星爆',baseHp:170,baseAtk:38,baseDef:14},
{name:'霜鈴',rarity:'★★★★',stars:4,element:'冰',emoji:'🐈',role:'控場手',desc:'能以冰晶守護隊友的雪原貓咪。',skill:'霜華結界',baseHp:168,baseAtk:25,baseDef:20},
{name:'雷豆',rarity:'★★★',stars:3,element:'雷',emoji:'😻',role:'速度手',desc:'總是第一個衝向冒險的雷電小貓。',skill:'電光連爪',baseHp:140,baseAtk:24,baseDef:13},
{name:'石球',rarity:'★★',stars:2,element:'岩',emoji:'🐹',role:'防守手',desc:'背著小石盾的可靠夥伴。',skill:'岩壁防護',baseHp:155,baseAtk:14,baseDef:20},
{name:'奶糖',rarity:'★',stars:1,element:'草',emoji:'🐇',role:'新手',desc:'喜歡花草，會努力幫忙的小夥伴。',skill:'嫩芽拍擊',baseHp:112,baseAtk:12,baseDef:10}
];
state.party=Array.isArray(state.party)?state.party:['咪露','沫沫','雪糕'];
state.party=state.party.filter(n=>characters.some(ch=>ch.name===n)&&state.owned.includes(n)).slice(0,4);
function characterStats(ch,level=1){const growth=Math.max(0,level-1);return {hp:ch.baseHp+growth*Math.round(ch.baseHp*.08),atk:ch.baseAtk+growth*Math.max(1,Math.round(ch.baseAtk*.09)),def:ch.baseDef+growth*Math.max(1,Math.round(ch.baseDef*.07))};}
function save(){state.gems=Number(state.gems)||0;state.coins=Number(state.coins)||0;state.primogems=Number(state.primogems)||0;localStorage.setItem('starTraveler',JSON.stringify(state));$('gems').textContent=state.gems;$('coins').textContent=state.coins;$('primogems').textContent=state.primogems}

function wish(n){let cost=n*160;if(state.gems<cost){alert('星石不足！先完成委託或開寶箱吧。');return}state.gems-=cost;let got=[];const pools={5:characters.filter(x=>x.stars===5),4:characters.filter(x=>x.stars===4),3:characters.filter(x=>x.stars===3),2:characters.filter(x=>x.stars===2),1:characters.filter(x=>x.stars===1)};function pick(pool){return pool[Math.floor(Math.random()*pool.length)]}for(let i=0;i<n;i++){state.pity++;let roll=Math.random(),ch;if(state.pity>=90||roll<.006){ch=pick(pools[5]);state.pity=0}else if(roll<.057)ch=pick(pools[4]);else if(roll<.30)ch=pick(pools[3]);else if(roll<.60)ch=pick(pools[2]);else ch=pick(pools[1]);if(!ch)ch=pick(pools[1]);if(!state.owned.includes(ch.name))state.owned.push(ch.name);got.push(ch)}if(n===10&&!got.some(x=>x.stars>=3)){let guaranteed=pick([...pools[3],...pools[4]]);got[got.length-1]=guaranteed;if(!state.owned.includes(guaranteed.name))state.owned.push(guaranteed.name)}save();pendingWishResults=got;$('wishCards').innerHTML='';$('wishTitle').textContent='✦ 星願降臨 ✦';$('wishSubtitle').textContent='貓咪夥伴正在來到你的身邊……';$('wishClose').style.display='none';$('wishSkip').style.display='block';$('wishReveal').classList.add('show');$('wishReveal').classList.remove('ready');setTimeout(()=>{$('wishReveal').classList.add('ready');$('wishSubtitle').textContent='光芒落下，看看你遇見了誰！';setTimeout(revealWishCards,750)},250)}

function makeCat(){

 const legs=[];

 g.position.set(x,0,z);scene3d.add(g);
}
function addRock(x,z,look,scale=1){
 const colors=state.region==='霜晶雪原'?0x9fc9dd:state.region==='熾焰山脈'?0x533d3b:0x778c83;
 const rock=addMesh(scene3d,new THREE.DodecahedronGeometry(scale,0),mat(colors),x,scale*.55,z);rock.scale.y=.8;
}
function addChest(x,z,id,look){
 const g=new THREE.Group(),wood=mat(0x80502e),gold=mat(look.accent,.4,{metalness:.55}),dark=mat(0x382d2a);
 addMesh(g,new THREE.BoxGeometry(.95,.58,.68),wood,0,.42,0);
 addMesh(g,new THREE.BoxGeometry(1,.12,.72),gold,0,.68,0);
 const lid=addMesh(g,new THREE.BoxGeometry(.98,.22,.7),wood,0,.82,0);lid.rotation.x=-.12;
 addMesh(g,new THREE.BoxGeometry(.13,.28,.08),gold,0,.56,-.37);
 const ring=addMesh(g,new THREE.TorusGeometry(.62,.025,6,24),mat(look.accent,.4,{emissive:look.accent}),0,.08,0);ring.rotation.x=Math.PI/2;
 g.position.set(x,0,z);g.userData={kind:'chest',id,opened:state.openedChests.includes(id)};if(g.userData.opened)lid.rotation.x=-.85;scene3d.add(g);worldObjects.push(g);
}
function addMonster(x,z,look){
 const g=new THREE.Group(),bodyColor=state.region==='熾焰山脈'?0xb95738:state.region==='霜晶雪原'?0x8ed5ee:state.region==='蒼翠森林'?0x9bba5b:0x79c96a;
 addMesh(g,new THREE.SphereGeometry(.63,18,14),mat(bodyColor),0,.62,0);
 addMesh(g,new THREE.SphereGeometry(.43,16,12),mat(bodyColor),0,1.12,-.06);
 for(const side of [-1,1]){
  const horn=addMesh(g,new THREE.ConeGeometry(.13,.38,6),mat(0xf5e5b7),side*.28,1.52,-.08);horn.rotation.z=side*-.35;
  addMesh(g,new THREE.SphereGeometry(.07,10,8),mat(0x382b36),side*.17,1.18,-.45);
 }
 const aura=addMesh(g,new THREE.TorusGeometry(.85,.035,6,32),mat(look.accent,.4,{emissive:look.accent}),0,.08,0);aura.rotation.x=Math.PI/2;
 g.position.set(x,0,z);g.userData={kind:'monster'};scene3d.add(g);worldObjects.push(g);
}
function addResourceNode(x,z,id,look){
 const key=state.region+'-'+id;if(state.gatheredNodes.includes(key))return;
 const g=new THREE.Group(),crystalColor=state.region==='霜晶雪原'?0x9bd9e8:state.region==='熾焰山脈'?0xd66b43:state.region==='蒼翠森林'?0x91bd79:0xd0b06a;
 const crystal=addMesh(g,new THREE.OctahedronGeometry(.48,1),mat(crystalColor,.3,{emissive:crystalColor,emissiveIntensity:.16}),0,.72,0);crystal.scale.set(.8,1.5,.8);
 const shard=addMesh(g,new THREE.OctahedronGeometry(.25,0),mat(look.accent,.25,{emissive:look.accent}),.42,.4,.08);shard.rotation.z=.5;
 const ring=addMesh(g,new THREE.TorusGeometry(.72,.025,6,24),mat(look.accent,.4,{emissive:look.accent}),0,.08,0);ring.rotation.x=Math.PI/2;
 g.position.set(x,0,z);g.userData={kind:'resource',id,key};scene3d.add(g);worldObjects.push(g);
}
function buildZone(){
 const look=zoneLooks[state.region]||zoneLooks['風語草原'];
 scene3d.background=new THREE.Color(look.sky);scene3d.fog=new THREE.Fog(look.fog,18,66);
 scene3d.children.slice().forEach(o=>{if(o!==player3d&&!o.isLight)scene3d.remove(o)});worldObjects=[];
 const ground=addMesh(scene3d,new THREE.PlaneGeometry(120,120,50,50),mat(look.ground,1),0,-.08,0);ground.rotation.x=-Math.PI/2;ground.userData.zoneObject=true;
 const grid=new THREE.GridHelper(120,30,0x46574d,0x596b5c);grid.material.transparent=true;grid.material.opacity=.12;grid.position.y=-.065;grid.userData.zoneObject=true;scene3d.add(grid);
 for(let i=0;i<48;i++){
  const x=(Math.random()-.5)*82,z=(Math.random()-.5)*82;
  if(Math.abs(x)<7&&Math.abs(z)<7)continue;
  if(state.region==='熾焰山脈'){
   if(Math.random()<.58)addRock(x,z,look,.8+Math.random()*2);else{
    const crack=addMesh(scene3d,new THREE.BoxGeometry(.12+Math.random()*.22,.035,1.2+Math.random()*2.2),mat(0x9a4934,.45,{emissive:0x4a160d}),x,.015,z);crack.rotation.y=Math.random()*Math.PI;
   }
  }else if(state.region==='霜晶雪原'){
   if(Math.random()<.62)addRock(x,z,look,.5+Math.random()*1.5);
   const ice=addMesh(scene3d,new THREE.ConeGeometry(.35+Math.random()*.5,1.2+Math.random()*2.5,5),mat(0x9bbbc6,.35,{metalness:.12}),x,.55,z);ice.rotation.z=(Math.random()-.5)*.18;
  }else if(state.region==='蒼翠森林'){
   if(Math.random()<.72)addTree(x,z,look,.75+Math.random()*.95);else{
    const stem=addMesh(scene3d,new THREE.CylinderGeometry(.09,.12,.38,7),mat(0xc3a47b),x,.19,z);
    addMesh(scene3d,new THREE.SphereGeometry(.3,10,8),mat(0x9d655d),x,.42,z);
   }
  }else{
   if(Math.random()<.7)addTree(x,z,look,.7+Math.random()*.8);else addRock(x,z,look,.4+Math.random()*.8);
   if(Math.random()<.42){const tuft=addMesh(scene3d,new THREE.ConeGeometry(.18,.55,5),mat(0x9b9b62),x,.25,z);tuft.rotation.z=(Math.random()-.5)*.7}
  }
 }
 for(let i=0;i<9;i++){
  const a=i*Math.PI*2/9,r=33+Math.random()*8;
  const mountain=addMesh(scene3d,new THREE.ConeGeometry(5+Math.random()*4,12+Math.random()*10,6),mat(state.region==='霜晶雪原'?0xd9eff7:state.region==='熾焰山脈'?0x493b43:0x657f72),Math.cos(a)*r,5,Math.sin(a)*r);mountain.userData.zoneObject=true;
 }
 const spots=[
  {x:-23.1,z:-14.3,kind:'quest'},
  {x:23.1,z:-7.7,kind:'monster'},
  {x:20.9,z:15.4,kind:'chest',id:0},
  {x:-14.3,z:-3.85,kind:'chest',id:1},
  {x:2.75,z:-12.1,kind:'chest',id:2},
  {x:12.1,z:8.25,kind:'chest',id:3},
  {x:-4.4,z:17.6,kind:'chest',id:4}
 ];
 for(const p of spots){
  if(p.kind==='chest')addChest(p.x,p.z,p.id,look);
  else if(p.kind==='monster')addMonster(p.x,p.z,look);
  else{
   const q=new THREE.Group();
   addMesh(q,new THREE.CylinderGeometry(.08,.16,1.4,8),mat(look.accent),0,.7,0);
   addMesh(q,new THREE.OctahedronGeometry(.42),mat(0xffe7a3,.25,{emissive:0xd89b38}),0,1.65,0);
   const ring=addMesh(q,new THREE.TorusGeometry(.8,.04,8,32),mat(look.accent),0,.12,0);ring.rotation.x=Math.PI/2;
   q.position.set(p.x,0,p.z);q.userData={kind:'quest'};scene3d.add(q);worldObjects.push(q);
  }
 }
 // 小型發光水晶與道路石塊
 for(let i=0;i<16;i++){const x=(Math.random()-.5)*48,z=(Math.random()-.5)*48;const crystal=addMesh(scene3d,new THREE.OctahedronGeometry(.25+Math.random()*.25),mat(look.accent,.3,{emissive:look.accent}),x,.35,z);crystal.userData.zoneObject=true}
 const resourceSpots=[[-18,18],[18,-22],[-28,-5]];
 resourceSpots.forEach((p,i)=>addResourceNode(p[0],p[1],i,look));
}
function init3DWorld(){
 if(!window.THREE){activate2DFallback('3D 引擎載入失敗，請確認網路後重新整理。');return}
 try{
 const canvas=$('world3d');scene3d=new THREE.Scene();camera3d=new THREE.PerspectiveCamera(55,1,.1,180);
 renderer3d=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'low-power'});renderer3d.setPixelRatio(Math.min(window.devicePixelRatio||1,1.35));renderer3d.shadowMap.enabled=false;
 scene3d.add(new THREE.HemisphereLight(0xc8d4df,0x343b35,1.05));
 const sun=new THREE.DirectionalLight(0xd9d1bd,.82);sun.position.set(-12,25,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene3d.add(sun);
 player3d=makeCat();player3d.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene3d.add(player3d);
 buildZone();update3DPlayer();resize3D();threeReady=true;animate3D();
 let dragging=false,lastX=0,lastY=0;
 canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{if(!dragging)return;cameraYaw-=(e.clientX-lastX)*.006;cameraPitch=Math.max(.18,Math.min(1.05,cameraPitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});
 canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
 canvas.addEventListener('wheel',e=>{cameraDistance=Math.max(5,Math.min(18,cameraDistance+e.deltaY*.01));e.preventDefault()},{passive:false});
 window.addEventListener('resize',resize3D);
 }catch(err){console.error('3D 初始化失敗：',err);if(renderer3d){renderer3d.dispose();renderer3d=null}activate2DFallback('3D 顯示裝置不支援或載入失敗，已切換安全模式。')}
}
function activate2DFallback(message){threeReady=false;renderer3d=null;$('world').classList.add('fallback2d');$('worldHint').textContent=message;$('hero').style.left=state.x+'%';$('hero').style.top=state.y+'%';$('world').style.backgroundImage=regionBackgrounds[state.region]||regionBackgrounds['風語草原'];document.querySelectorAll('[data-interact]').forEach(b=>b.style.display='block');}
function resize3D(){if(!renderer3d)return;const w=$('world').clientWidth,h=$('world').clientHeight;renderer3d.setSize(w,h,false);camera3d.aspect=w/h;camera3d.updateProjectionMatrix()}
function update3DPlayer(){if(!player3d)return;player3d.position.set((state.x-50)*.55,0,(state.y-50)*.55)}
function update3DInteraction(){
 if(!threeReady)return;
 const px=player3d.position.x,pz=player3d.position.z;let best=Infinity,nearest=null;
 for(const obj of worldObjects){
  if(obj.userData.kind==='chest'&&state.openedChests.includes(obj.userData.id))continue;
  if(obj.userData.kind==='resource'&&state.gatheredNodes.includes(obj.userData.key))continue;
  const d=Math.hypot(obj.position.x-px,obj.position.z-pz);if(d<best){best=d;nearest=obj}
 }
 const close=best<3.3,btns=[...document.querySelectorAll('[data-interact]')];btns.forEach(b=>b.classList.remove('nearby'));
 if(close&&nearest){
  if(nearest.userData.kind==='resource')nearbyPoi=nearest;
  else{const type=nearest.userData.kind;nearbyPoi=btns.find(b=>b.dataset.interact===type&&(type!=='chest'||Number(b.dataset.chestId)===nearest.userData.id))||null}
 }else nearbyPoi=null;
 if(nearbyPoi&&nearbyPoi.classList)nearbyPoi.classList.add('nearby');
 $('interactBtn').classList.toggle('show',!!nearbyPoi);
 const kind=nearbyPoi?.userData?.kind||nearbyPoi?.dataset?.interact;
 const labels={quest:'冒險委託',monster:'地區魔物',chest:'寶箱',resource:'地區晶礦'};
 $('interactBtn').textContent=kind==='resource'?'按 E 採集':'按 E 互動';
 $('worldHint').textContent=nearbyPoi?'已靠近：'+(labels[kind]||'探索目標')+' · '+(kind==='resource'?'按 E 採集':'按 E 互動'):'探索 '+state.region+'，尋找寶箱、魔物與發光晶礦';
}
function updateNearbyInteraction(){if(threeReady)update3DInteraction();else{$('worldHint').textContent='3D 世界載入中……'}}
function animate3D(t=0){
 if(!renderer3d)return;
 requestAnimationFrame(animate3D);
 try{
  const dt=Math.min(.05,(t-lastFrame)/1000||.016);lastFrame=t;
  const keys=heldKeys;
  let ix=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);
  let iz=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);
  for(const [id,v] of heldButtons){ix+=v.x;iz+=v.z}
  const inputLen=Math.hypot(ix,iz);if(inputLen>1){ix/=inputLen;iz/=inputLen}
  const moving=inputLen>.01;
  const worldX=ix*Math.cos(cameraYaw)+iz*Math.sin(cameraYaw);
  const worldZ=-ix*Math.sin(cameraYaw)+iz*Math.cos(cameraYaw);
  if(moving){
   const speed=15*dt;state.x=Math.max(5,Math.min(95,state.x+worldX*speed));state.y=Math.max(12,Math.min(88,state.y+worldZ*speed));
   $('hero').style.left=state.x+'%';$('hero').style.top=state.y+'%';$('loc').textContent='📍 '+state.region;
   update3DPlayer();update3DInteraction();
   const desired=Math.atan2(-worldX,-worldZ);
   let diff=((desired-player3d.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
   player3d.rotation.y+=diff*Math.min(1,dt*12);
  }else{
   const away=cameraYaw;
   let diff=((away-player3d.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
   player3d.rotation.y+=diff*Math.min(1,dt*5);
  }
  walkBlend+=((moving?1:0)-walkBlend)*Math.min(1,dt*8);
  if(player3d){
   const phase=t*.013,blend=walkBlend,legs=player3d.userData.legs;
   player3d.userData.walkPhase=phase;
   legs.forEach((leg,i)=>{const offset=(i===0||i===3)?0:Math.PI;leg.rotation.x=Math.sin(phase+offset)*.62*blend});
   player3d.userData.body.position.y=.78+Math.abs(Math.sin(phase*2))*.055*blend+Math.sin(t*.003)*.012;
   player3d.userData.head.rotation.x=Math.sin(phase*2)*.035*blend;
   player3d.userData.tail.rotation.x=Math.sin(phase*.75)*.16;
   player3d.userData.tail.rotation.z=Math.cos(phase*.75)*.09;
   player3d.userData.ears.forEach((ear,i)=>ear.rotation.z=(i===0?-.22:.22)+Math.sin(t*.004+i)*.025);
   player3d.position.y=.015+Math.abs(Math.sin(phase*2))*.025*blend;
   player3d.rotation.z=Math.sin(phase)*.035*blend;
  }
  $('compassRose').style.transform='rotate('+(-cameraYaw*180/Math.PI)+'deg)';
  camera3d.position.set(player3d.position.x+Math.sin(cameraYaw)*cameraDistance,player3d.position.y+cameraDistance*Math.sin(cameraPitch)+1.2,player3d.position.z+Math.cos(cameraYaw)*cameraDistance);
  camera3d.lookAt(player3d.position.x,player3d.position.y+1.05,player3d.position.z);
  worldObjects.forEach(o=>{if(o.userData.kind==='quest'&&o.children[1])o.children[1].rotation.y+=dt*.9});
  renderer3d.render(scene3d,camera3d);
 }catch(err){console.error('3D 畫面執行失敗，切換安全模式：',err);activate2DFallback('3D 顯示發生錯誤，已切換安全模式。')}
}
function updateWorldBackground(){if(threeReady){buildZone();update3DPlayer();update3DInteraction()}else{$('world').style.backgroundImage=regionBackgrounds[state.region]||regionBackgrounds['風語草原']} $('loc').textContent='📍 '+state.region}

let nearbyPoi=null;
function updateNearbyInteraction(){if(threeReady){update3DInteraction();return}const buttons=[...document.querySelectorAll('[data-interact]')];let closest=null,best=Infinity;buttons.forEach(btn=>{const x=parseFloat(btn.style.left||(btn.style.right?100-parseFloat(btn.style.right):50));const y=parseFloat(btn.style.top||(btn.style.bottom?100-parseFloat(btn.style.bottom):50));const d=Math.hypot(state.x-x,state.y-y);btn.classList.toggle('nearby',d<=13);if(d<best){best=d;closest=btn}});nearbyPoi=best<=13?closest:null;$('interactBtn').classList.toggle('show',!!nearbyPoi);$('worldHint').textContent=nearbyPoi?'已靠近：'+(nearbyPoi.dataset.interact==='quest'?'冒險委託':nearbyPoi.dataset.interact==='monster'?'魔物':'寶箱')+' · 按 E 或點擊互動':'移動貓咪靠近委託、魔物或寶箱，再按 E 互動'}
function interactCurrent(){
 if(!nearbyPoi){$('worldHint').textContent='還太遠了！再靠近一點才能互動。';return}
 if(nearbyPoi.userData?.kind==='resource'){gatherResource(nearbyPoi.userData.id);return}
 const type=nearbyPoi.dataset.interact;if(type==='quest')openPanel('quest');else if(type==='monster')startBattle();else if(type==='chest')openChest(Number(nearbyPoi.dataset.chestId))
}
function gatherResource(id){
 const key=state.region+'-'+id;if(state.gatheredNodes.includes(key))return;
 state.gatheredNodes.push(key);state.materials[state.region]=(Number(state.materials[state.region])||0)+1;
 const gems=35,coins=25,primogems=2;state.gems+=gems;state.coins+=coins;state.primogems+=primogems;
 save();if(threeReady)buildZone();update3DInteraction();
 $('worldHint').textContent='採集成功！獲得地區晶礦、'+gems+' 星石、'+coins+' 摩拉與 '+primogems+' 原石。';
}
function claimGatherQuest(){if(state.gatheredNodes.length<12||state.claimedQuests.includes('gather'))return;state.claimedQuests.push('gather');state.gems+=80;state.primogems+=20;save();openPanel('quest');alert('世界探索完成！獲得 80 星石與 20 原石！')}
document.querySelectorAll('[data-interact]').forEach(btn=>btn.addEventListener('click',()=>{if(btn.classList.contains('nearby')){nearbyPoi=btn;interactCurrent()}else{$('worldHint').textContent='還太遠了！請先走近這個標記。'}}));
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openPanel(b.dataset.tab));
document.querySelectorAll('[data-move]').forEach(b=>{const [x,y]=b.dataset.move.split(',').map(Number);const id=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);heldButtons.set(id,{x:Math.sign(x),z:Math.sign(y)})});const stop=()=>heldButtons.delete(id);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop)});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){e.preventDefault();heldKeys.add(k)}if(k==='e')interactCurrent()});
document.addEventListener('keyup',e=>heldKeys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{heldKeys.clear();heldButtons.clear()});
$('hero').style.left=state.x+'%';$('hero').style.top=state.y+'%';
try{init3DWorld()}catch(err){console.error('遊戲世界初始化失敗：',err);activate2DFallback('世界載入失敗，已啟用安全模式。')}
try{updateWorldBackground();updateNearbyInteraction();save();openPanel('home')}catch(err){console.error('遊戲介面初始化失敗：',err);const content=$('content');if(content)content.innerHTML='<h2>星境旅人</h2><p>遊戲已載入，但部分介面發生錯誤。請重新整理頁面。</p>';}
</script></body></html>
