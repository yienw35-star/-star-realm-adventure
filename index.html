<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172b45"><title>星境旅人｜開放世界 RPG</title>
<style>
:root{--gold:#f4d58a;--panel:#14283ddd;--line:#ffffff35}*{box-sizing:border-box}
body{margin:0;background:#101d2b;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;overflow-x:hidden}
header{height:54px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;background:#0c1826eF;border-bottom:1px solid var(--line);position:relative;z-index:2}
.brand{font-weight:900;letter-spacing:2px;color:var(--gold)}.stats{font-size:13px;display:flex;gap:12px}
main{max-width:1000px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px}
#world{height:min(66vh,570px);min-height:370px;position:relative;overflow:hidden;border:1px solid #ffffff45;border-radius:17px;background:linear-gradient(#7db3c2 0%,#b4d0bd 47%,#658b67 48%,#284b42 100%)}
#world:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,#fff7 0 2%,transparent 25%),linear-gradient(130deg,transparent 35%,#ffffff12 36% 37%,transparent 38%);pointer-events:none}
.mountain{position:absolute;bottom:40%;width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-bottom:190px solid #627e86;filter:drop-shadow(0 7px 0 #506d67)}
.m1{left:-35px}.m2{right:-55px;transform:scale(1.3);border-bottom-color:#718b91}
.tree{position:absolute;font-size:42px;filter:drop-shadow(2px 4px 2px #183b2c99)}
#hero{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font-size:58px;filter:drop-shadow(0 5px 3px #1225);z-index:1;transition:left .12s,top .12s;animation:catIdle 1.8s ease-in-out infinite;user-select:none} @keyframes catIdle{0%,100%{translate:0 0}50%{translate:0 -7px}}
#hero:after{content:"";position:absolute;width:34px;height:8px;background:#10251c66;border-radius:50%;bottom:-1px;left:5px;z-index:-1}
.location{position:absolute;top:12px;left:12px;background:#102238b9;padding:7px 11px;border-radius:9px;font-size:13px}
.hint{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;background:#102238a9;padding:7px;border-radius:9px;font-size:12px}
.poi{position:absolute;border:0;background:#f5d78c;color:#263448;border-radius:20px;padding:6px 10px;font-weight:800;box-shadow:0 3px 10px #1425}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;min-height:370px}
h2{font-size:17px;margin:0 0 10px;color:var(--gold)}.muted{color:#b9c8d4;font-size:12px}
button{font:inherit;cursor:pointer}.tabrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.tab,.action{border:1px solid var(--line);background:#ffffff12;color:white;border-radius:9px;padding:9px 5px;font-size:13px}
.tab.active,.action.primary{background:linear-gradient(120deg,#b98b4d,#e4c47e);color:#263448;border:0;font-weight:800}
.content{font-size:13px;line-height:1.6}.action{width:100%;margin-top:7px}
.card{background:#ffffff10;border:1px solid var(--line);border-radius:10px;padding:9px;margin:7px 0}
#controls{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:5px;justify-content:center;margin:12px auto}
#controls button{border-radius:12px;background:#14283ddd;color:white;border:1px solid #ffffff66;font-size:20px;touch-action:none}
#controls .up{grid-column:2}.down{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}
#battle{display:none;position:fixed;inset:0;background:#081321eF;z-index:5;align-items:center;justify-content:center;padding:18px}
#battlebox{max-width:420px;width:100%;background:linear-gradient(145deg,#253d5b,#17233a);border:1px solid #ffffff55;border-radius:18px;padding:20px;text-align:center}
.enemy{font-size:75px;margin:10px}.bar{height:9px;background:#ffffff25;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#e77e70;width:100%}.catStats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:9px 0}.catStat{background:#ffffff12;border:1px solid var(--line);border-radius:8px;padding:7px}.catStat b{color:#ffe3a0}.catHp{height:8px;background:#ffffff25;border-radius:9px;overflow:hidden;margin:6px 0}.catHp i{display:block;height:100%;background:#79d49b;width:100%}

#wishReveal{display:none;position:fixed;inset:0;z-index:8;background:radial-gradient(ellipse at 50% 35%,#66518f 0%,#17233f 48%,#080f20 100%);align-items:center;justify-content:center;padding:18px;overflow:auto}
#wishReveal.show{display:flex;animation:wishFade .35s ease-out}
#wishBox{width:min(760px,100%);text-align:center}
#wishTitle{font-size:clamp(23px,5vw,38px);font-weight:900;color:#ffe6a5;text-shadow:0 0 22px #ffdb83;margin:4px 0 8px}
#wishSubtitle{color:#e6d9ff;font-size:13px;margin-bottom:18px}
#wishBeam{height:5px;width:0;margin:0 auto 20px;background:linear-gradient(90deg,transparent,#fff,#ffe28b,transparent);box-shadow:0 0 24px 8px #d8c2ff;transition:width .7s ease}
#wishReveal.ready #wishBeam{width:90%}
#wishCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.wishCard{min-height:175px;border:1px solid #ffffff55;border-radius:14px;padding:12px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:translateY(22px) scale(.8);animation:wishPop .5s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--delay);box-shadow:0 8px 25px #0006}
.wishCard.r5{background:linear-gradient(155deg,#9b642e,#553b73 75%);border-color:#ffe3a0;box-shadow:0 0 20px #f7cf7c66}
.wishCard.r4{background:linear-gradient(155deg,#554b91,#263e68)}
.wishCard.r3{background:linear-gradient(155deg,#53677d,#29374c)}
.wishEmoji{font-size:clamp(34px,7vw,56px);margin:8px 0;filter:drop-shadow(0 5px 6px #0008)}
.wishName{font-weight:900;font-size:13px;line-height:1.4}
.wishStars{color:#ffe08a;letter-spacing:1px;font-size:12px;margin-top:7px}
#wishClose{max-width:260px;margin:20px auto 0}
@keyframes wishFade{from{opacity:0}to{opacity:1}}
@keyframes wishPop{to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){#wishCards{grid-template-columns:repeat(2,minmax(0,1fr))}.wishCard{min-height:145px}}
@media(max-width:720px){main{display:flex;flex-direction:column;padding:8px}#world{height:48vh;min-height:310px}#panel{min-height:0}#controls{display:grid}.stats{gap:7px;font-size:12px}}
</style></head>
<body>
<header><div class="brand">✦ 星境旅人</div><div class="stats"><span>💎 <b id="gems">1600</b></span><span>🪙 <b id="coins">300</b></span><span>⭐ <b id="primogems">0</b></span></div></header>
<main><section>
<div id="world">
<div class="mountain m1"></div><div class="mountain m2"></div>
<div class="tree" style="left:12%;bottom:15%">🌲</div><div class="tree" style="left:29%;bottom:22%">🌳</div><div class="tree" style="right:15%;bottom:13%">🌲</div><div class="tree" style="right:34%;bottom:27%">🌳</div>
<div class="location" id="loc">📍 貓咪風語草原</div><div id="hero" role="img" aria-label="玩家主角：驚嚇貓" title="驚嚇貓">🐈</div>
<button class="poi" style="left:8%;top:24%" onclick="openPanel('quest')">📜 委託</button>
<button class="poi" style="right:8%;top:36%" onclick="startBattle()">⚔️ 魔物</button>
<button class="poi" style="right:12%;bottom:22%" onclick="openPanel('chest')">🎁 寶箱</button>
<div class="hint">操控驚嚇貓探索世界 · 靠近標記可進行互動</div></div>
<div id="controls"><button class="up" data-move="0,-5">↑</button><button class="left" data-move="-5,0">←</button><button class="down" data-move="0,5">↓</button><button class="right" data-move="5,0">→</button></div>
</section>
<aside id="panel"><div class="tabrow"><button class="tab active" data-tab="home">冒險</button><button class="tab" data-tab="gacha">祈願</button><button class="tab" data-tab="bag">角色</button></div><div id="content" class="content"></div></aside></main>
<div id="wishReveal"><div id="wishBox"><div id="wishTitle">✦ 星願降臨 ✦</div><div id="wishSubtitle">命運的星光正在揭曉……</div><div id="wishBeam"></div><div id="wishCards"></div><button id="wishClose" class="action primary" onclick="closeWishReveal()" style="display:none">收下祈願結果</button><button id="wishSkip" class="action" onclick="revealWishCards()">跳過動畫</button></div></div>
<div id="battle"><div id="battlebox"><div class="muted">驚嚇貓出擊！</div><h2>史萊姆</h2><div class="enemy">🟢</div><div class="bar"><i id="enemyhp"></i></div><div class="muted" id="catBattleStats">🐈 驚嚇貓 HP：180 / 180</div><div class="catHp"><i id="catHpBar"></i></div><p id="battlemsg">一隻野生史萊姆擋住了去路！</p><button class="action primary" onclick="attack()">🐾 貓掌普通攻擊</button><button class="action" onclick="skill()">✨ 貓咪星光衝擊</button><button class="action" onclick="runAway()">撤退</button></div></div>
<script>
const $=id=>document.getElementById(id);
let state=JSON.parse(localStorage.getItem('starTraveler')||'null')||{gems:1600,coins:300,primogems:0,owned:['風行者・菲亞'],pity:0,x:50,y:55,chest:false,quest:false};
state.catLevel=state.catLevel||1;state.catXp=state.catXp||0;
// 所有角色統一使用相同欄位：name、rarity、stars、element、emoji、role、desc、skill、baseHp、baseAtk、baseDef
const characters=[
{name:'星爪・咪露',rarity:'★★★★★',stars:5,element:'星',emoji:'🐱',role:'主攻手',desc:'把星光凝聚在貓掌上的勇敢小隊長。',skill:'星月爪擊',baseHp:180,baseAtk:32,baseDef:18},
{name:'焰尾・燒燒',rarity:'★★★★★',stars:5,element:'火',emoji:'🐈',role:'爆發手',desc:'尾巴燃起火焰，擅長瞬間爆發。',skill:'喵焰流星',baseHp:165,baseAtk:36,baseDef:15},
{name:'潮泡・沫沫',rarity:'★★★★',stars:4,element:'水',emoji:'😺',role:'治療手',desc:'用泡泡治癒夥伴的溫柔貓咪。',skill:'泡泡療癒',baseHp:175,baseAtk:23,baseDef:19},
{name:'霜耳・雪糕',rarity:'★★★★',stars:4,element:'冰',emoji:'🐈‍⬛',role:'控場手',desc:'能讓敵人慢下來的冷靜貓咪。',skill:'冰晶喵環',baseHp:160,baseAtk:27,baseDef:17},
{name:'雷鬚・電電',rarity:'★★★★',stars:4,element:'雷',emoji:'😼',role:'速度手',desc:'快如閃電，連鬍鬚都帶著電光。',skill:'雷光衝刺',baseHp:155,baseAtk:29,baseDef:15},
{name:'草球・芽芽',rarity:'★★★',stars:3,element:'草',emoji:'😸',role:'輔助手',desc:'帶著小草球旅行的活潑貓咪。',skill:'嫩葉拍擊',baseHp:145,baseAtk:21,baseDef:14},
{name:'風鈴・呼呼',rarity:'★★★',stars:3,element:'風',emoji:'🐾',role:'速度手',desc:'跑過時會帶起一陣微風。',skill:'旋風肉球',baseHp:135,baseAtk:23,baseDef:12},
{name:'石掌・圓圓',rarity:'★★',stars:2,element:'岩',emoji:'🐱',role:'防守手',desc:'圓滾滾但很可靠的小守衛。',skill:'小石盾',baseHp:150,baseAtk:15,baseDef:18},
{name:'水點・滴滴',rarity:'★★',stars:2,element:'水',emoji:'😺',role:'輔助手',desc:'喜歡玩水，能幫隊伍補充活力。',skill:'水滴彈',baseHp:130,baseAtk:16,baseDef:14},
{name:'豆豆',rarity:'★',stars:1,element:'無',emoji:'🐈',role:'新手',desc:'剛踏上旅程、努力學習的小貓。',skill:'努力喵拳',baseHp:110,baseAtk:12,baseDef:10},
{name:'小灰',rarity:'★',stars:1,element:'無',emoji:'🐾',role:'新手',desc:'膽小但很努力，總是跟著大家。',skill:'勇氣拍擊',baseHp:115,baseAtk:11,baseDef:11}
];
function characterStats(ch,level=1){const growth=Math.max(0,level-1);return {hp:ch.baseHp+growth*Math.round(ch.baseHp*.08),atk:ch.baseAtk+growth*Math.max(1,Math.round(ch.baseAtk*.09)),def:ch.baseDef+growth*Math.max(1,Math.round(ch.baseDef*.07))};}
function save(){localStorage.setItem('starTraveler',JSON.stringify(state));$('gems').textContent=state.gems;$('coins').textContent=state.coins;$('primogems').textContent=state.primogems}
function openPanel(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let c=$('content');
if(tab==='gacha')c.innerHTML=`<h2>✦ 星願祈願</h2><div class="card" style="background:linear-gradient(130deg,#514276,#1e4260)"><div style="font-size:12px;color:#f6d58b">期間限定角色祈願</div><div style="font-size:23px;font-weight:900">焰心・露卡</div><div style="font-size:48px">🔥 ⚔️</div><div class="muted">五星火元素角色 · 限定機率提升</div></div><div class="muted">五星 0.6% · 四星 5.1% · 三星 24.3% · 二星 30% · 一星 40% · 90 抽五星保底</div><button class="action primary" onclick="wish(1)">祈願一次 · 160 星石</button><button class="action" onclick="wish(10)">祈願十次 · 1600 星石</button><p class="muted">目前距離保底：${state.pity}/90</p>`;
else if(tab==='bag')c.innerHTML=`<h2>♡ 貓咪角色圖鑑</h2><div class="card" style="border-color:#f4d58a;background:linear-gradient(135deg,#66533b,#263a55)"><div style="font-size:34px">🐈</div><b>驚嚇貓・星境守護者</b><div class="muted">★★★★★ · 主角</div><div class="catStats"><div class="catStat">❤️ 生命值<br><b>${catMaxHp()}</b></div><div class="catStat">🐾 攻擊力<br><b>${catAttack()}</b></div><div class="catStat">🛡️ 防禦力<br><b>${catDefense()}</b></div><div class="catStat">⬆️ 等級<br><b>Lv. ${state.catLevel}</b></div></div><div class="muted">經驗值：${state.catXp} / ${state.catLevel*100}</div></div>${state.owned.map(n=>{let ch=characters.find(x=>x.name===n);if(!ch)return '';let st=characterStats(ch);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:18px">${ch.emoji} ${ch.name}</b><b style="color:${ch.stars===5?'#f4d58a':ch.stars===4?'#c7a6ed':'#9bc9e8'}">${ch.rarity}</b></div><div class="muted">${ch.element}元素 · ${ch.role}</div><p>${ch.desc}</p><div class="catStats"><div class="catStat">❤️ HP<br><b>${st.hp}</b></div><div class="catStat">🐾 攻擊<br><b>${st.atk}</b></div><div class="catStat">🛡️ 防禦<br><b>${st.def}</b></div><div class="catStat">✨ 技能<br><b>${ch.skill}</b></div></div></div>`}).join('')}` 
else if(tab==='quest')c.innerHTML=`<h2>📜 冒險委託</h2><div class="card"><b>草原的異動</b><p>擊敗一隻史萊姆，調查附近的魔物活動。</p><span class="muted">獎勵：原石 × 40、摩拉 × 100</span></div><button class="action primary" onclick="startBattle()">前往討伐</button>`;
else if(tab==='chest')c.innerHTML=`<h2>🎁 古老寶箱</h2><div class="card" style="text-align:center;font-size:48px">🧰</div><p>${state.chest?'這個寶箱已經被打開了。':'草叢後藏著一個古老的寶箱。'}</p><button class="action primary" onclick="openChest()" ${state.chest?'disabled':''}>開啟寶箱</button>`;
else c.innerHTML=`<h2>🌿 風語草原</h2><p>歡迎來到星境大陸！在這片遼闊的草原上，傳說七種元素守護著世界的平衡。</p><div class="card"><b>目前目標</b><br>探索草原、打倒史萊姆，並尋找古老寶箱。</div><button class="action primary" onclick="openPanel('quest')">查看冒險委託</button><button class="action" onclick="openPanel('gacha')">前往角色祈願</button>`;
}
let pendingWishResults=[];
function wish(n){let cost=n*160;if(state.gems<cost){alert('星石不足！先完成委託或開寶箱吧。');return}state.gems-=cost;let got=[];for(let i=0;i<n;i++){state.pity++;let r=Math.random(),ch;if(state.pity>=90||r<.006){ch=characters.filter(x=>x.stars===5)[Math.floor(Math.random()*characters.filter(x=>x.stars===5).length)];state.pity=0}else if(r<.057){let pool=characters.filter(x=>x.stars===4);ch=pool[Math.floor(Math.random()*pool.length)]}else if(r<.30){let pool=characters.filter(x=>x.stars===3);ch=pool[Math.floor(Math.random()*pool.length)]}else if(r<.60){let pool=characters.filter(x=>x.stars===2);ch=pool[Math.floor(Math.random()*pool.length)]}else{let pool=characters.filter(x=>x.stars===1);ch=pool[Math.floor(Math.random()*pool.length)]}if(!state.owned.includes(ch.name))state.owned.push(ch.name);got.push(ch)}save();pendingWishResults=got;$('wishCards').innerHTML='';$('wishTitle').textContent='✦ 星願降臨 ✦';$('wishSubtitle').textContent='命運的星光正在揭曉……';$('wishClose').style.display='none';$('wishSkip').style.display='block';$('wishReveal').classList.add('show');$('wishReveal').classList.remove('ready');setTimeout(()=>{$('wishReveal').classList.add('ready');$('wishSubtitle').textContent='光芒落下，看看你遇見了誰！';setTimeout(revealWishCards,750)},250)}
function revealWishCards(){if(!pendingWishResults.length)return;$('wishCards').innerHTML=pendingWishResults.map((ch,i)=>{let tier=ch.stars===5?'r5':ch.stars===4?'r4':'r3';return `<div class="wishCard ${tier}" style="--delay:${i*90}ms"><div class="muted">${ch.element}元素</div><div class="wishEmoji">${ch.emoji}</div><div class="wishName">${ch.name}</div><div class="wishStars">${ch.rarity}</div></div>`}).join('');$('wishTitle').textContent=pendingWishResults.some(x=>x.rarity==='★★★★★')?'★ 五星角色降臨！ ★':'✦ 祈願結果 ✦';$('wishSubtitle').textContent='新的相遇，已加入你的旅程。';$('wishSkip').style.display='none';$('wishClose').style.display='block';pendingWishResults=[]}
function closeWishReveal(){$('wishReveal').classList.remove('show');openPanel('gacha')}
const catMaxHp=()=>180+(state.catLevel-1)*22;const catAttack=()=>32+(state.catLevel-1)*5;const catDefense=()=>18+(state.catLevel-1)*3;
let hp=150,catHp=catMaxHp(),enemyMaxHp=150,skillReady=true;
function updateBattleBars(){$('enemyhp').style.width=Math.max(0,hp/enemyMaxHp*100)+'%';$('catHpBar').style.width=Math.max(0,catHp/catMaxHp()*100)+'%';$('catBattleStats').textContent=`🐈 驚嚇貓 HP：${Math.max(0,catHp)} / ${catMaxHp()}`}
function startBattle(){hp=enemyMaxHp;catHp=catMaxHp();skillReady=true;updateBattleBars();$('battlemsg').textContent='史萊姆出現了！驚嚇貓，準備戰鬥！';$('battle').style.display='flex'}
function attack(){if(hp<=0||catHp<=0)return;let dmg=catAttack();hp-=dmg;afterHit(`貓掌攻擊造成 ${dmg} 點傷害！`)}
function skill(){if(hp<=0||catHp<=0)return;if(!skillReady){$('battlemsg').textContent='星光衝擊還在蓄力，這回合先用貓掌攻擊吧！';return}let dmg=Math.round(catAttack()*1.8);hp-=dmg;skillReady=false;afterHit(`✨ 貓咪星光衝擊造成 ${dmg} 點傷害！`)}
function afterHit(msg){if(hp<=0){hp=0;updateBattleBars();$('battlemsg').textContent='勝利！驚嚇貓獲得 100 摩拉、20 原石與 35 經驗值！';state.coins+=100;state.primogems+=20;state.catXp+=35;if(state.catXp>=state.catLevel*100){state.catXp-=state.catLevel*100;state.catLevel++;alert('驚嚇貓升級了！目前等級 Lv.'+state.catLevel+'！生命、攻擊與防禦都提升了！')}save();setTimeout(()=>{$('battle').style.display='none';if(!state.quest){state.quest=true;state.primogems+=40;save();alert('委託完成！額外獲得 40 原石！')}},1300)}else{let retaliation=Math.max(3,16-catDefense()*.35);catHp=Math.max(0,catHp-Math.round(retaliation));skillReady=true;updateBattleBars();if(catHp<=0){$('battlemsg').textContent='驚嚇貓累倒了！先撤退休息，再來挑戰吧。'}else{$('battlemsg').textContent=msg+` 史萊姆剩餘 ${hp} HP。史萊姆反擊，驚嚇貓受到 ${Math.round(retaliation)} 點傷害。`}}}
function runAway(){$('battle').style.display='none'}
function openChest(){if(state.chest)return;state.chest=true;state.gems+=320;state.primogems+=20;save();openPanel('chest')}
function move(dx,dy){state.x=Math.max(5,Math.min(95,state.x+dx));state.y=Math.max(12,Math.min(88,state.y+dy));$('hero').style.left=state.x+'%';$('hero').style.top=state.y+'%';if(state.x>80&&state.y<35)$('loc').textContent='📍 風語村';else if(state.y<25)$('loc').textContent='📍 蒼翠山徑';else $('loc').textContent='📍 風語草原';}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openPanel(b.dataset.tab));
document.querySelectorAll('[data-move]').forEach(b=>{let [x,y]=b.dataset.move.split(',').map(Number);b.addEventListener('pointerdown',e=>{e.preventDefault();move(x,y)})});
document.addEventListener('keydown',e=>{if(['ArrowUp','w'].includes(e.key))move(0,-4);if(['ArrowDown','s'].includes(e.key))move(0,4);if(['ArrowLeft','a'].includes(e.key))move(-4,0);if(['ArrowRight','d'].includes(e.key))move(4,0)});
$('hero').style.left=state.x+'%';$('hero').style.top=state.y+'%';save();openPanel('home');
</script></body></html>
